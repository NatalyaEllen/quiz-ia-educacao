<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Quiz IA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="topbar">
        <div class="logo">
            <div class="logo-icon">🤖</div>
            <div>
                <strong>Quiz IA</strong>
                <span>na Educação</span>
            </div>
        </div>

        <div class="top-actions">
            <button class="theme-button" onclick="alternarTema()">☀️ Claro</button>
            <button class="theme-button" onclick="alternarTema()">🌙 Escuro</button>
        </div>
    </header>

    <main class="form-container">
        <div class="form-card">
            <span class="badge">👤 CADASTRO</span>
            <h1>Personalize sua experiência</h1>
            <p class="form-description">Antes de começar, conte um pouco sobre você.</p>

            <form id="formCadastro">
                <label for="nome">Qual é o seu nome?</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>

                <label>Selecione seu perfil</label>
                <p class="helper">Você pode selecionar mais de uma opção.</p>

                <div class="profiles-grid">
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Professor 1º"><span>Professor 1º</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Professor 2º"><span>Professor 2º</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Professor 3º"><span>Professor 3º</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Professor 4º"><span>Professor 4º</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Professor 5º"><span>Professor 5º</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Professor 6º"><span>Professor 6º</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Professor 7º"><span>Professor 7º</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Professor 8º"><span>Professor 8º</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Professor EJA"><span>Professor EJA</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="ATCOM"><span>ATCOM</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Estudante"><span>Estudante</span></label>
                    <label class="profile-option"><input type="checkbox" name="perfil" value="Visitante"><span>Visitante</span></label>
                </div>

                <label for="disciplina">
                    Disciplina que atua
                    <small>(opcional)</small>
                </label>
                <input type="text" id="disciplina" placeholder="Ex.: Matemática, Português...">

                <button type="submit" class="primary-button form-button">🚀 Começar Desafio</button>
            </form>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>
</body>

</html>
