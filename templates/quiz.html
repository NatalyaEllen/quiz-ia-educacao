<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz IA na Educação</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="topbar">
        <div class="logo">
            <div class="logo-icon">🤖</div>
            <div>
                <strong>Quiz IA</strong>
                <span>na Educação</span>
            </div>
        </div>

        <div class="quiz-header">
            <span id="pontuacaoHeader">⭐ 0 pontos</span>
            <button class="theme-button" onclick="alternarTema()">☀️ / 🌙</button>
        </div>
    </header>

    <main class="quiz-container">
        <section class="progress-section">
            <div class="progress-info">
                <span id="numeroPergunta">Pergunta 1 de 10</span>
                <span id="porcentagem">10%</span>
            </div>

            <div class="progress-bar">
                <div id="progress" class="progress"></div>
            </div>
        </section>

        <section class="quiz-layout">
            <aside class="mentor">
                <div class="mentor-title">🟢 Bit, o Mentor IA</div>

                <div class="quiz-mascot">
                    <div class="antenna"></div>
                    <div class="head">
                        <div class="eye"></div>
                        <div class="eye"></div>
                        <div class="mouth"></div>
                    </div>
                    <div class="body">
                        <div class="screen">✦</div>
                    </div>
                </div>

                <div class="mentor-message">
                    <strong>💬 Dica do Bit:</strong>
                    <p id="dica">Vamos pensar juntos!</p>
                </div>

                <div class="mentor-card">
                    💡
                    <strong>Aprenda enquanto joga</strong>
                    <p>
                        Mesmo quando você errar, receberá uma explicação para aprender com a questão.
                    </p>
                </div>
            </aside>

            <section class="question-card">
                <div class="category" id="categoria">ÉTICA E RESPONSABILIDADE</div>
                <h1 id="pergunta">Carregando pergunta...</h1>
                <div id="alternativas" class="answers"></div>
                <div id="feedback" class="feedback hidden"></div>
                <button id="btnResponder" class="primary-button answer-button">
                    Confirmar escolha →
                </button>
            </section>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
    <script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
</body>

</html>
